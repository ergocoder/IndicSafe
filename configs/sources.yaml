# Source registry — IndicSafe
# ---------------------------------------------------------------------------
# Every raw file is registered here with its role, format, field mapping and
# SHA-256 checksum. Raw files are read-only: they are read in place from their
# zip archives and never extracted into or written back to data/raw/.
#
# If a checksum no longer matches, the import stops (see provenance.py) so a
# silently changed raw file cannot leak into the seed pool.
#
# `role` values:
#   safety_seed                  -> may supply seed prompts with a provisional
#                                   intended_label (NOT a gold label)
#   benign_control               -> may supply benign seed prompts
#   language_validation_support  -> used later to build/evaluate language and
#                                   code-mix validators; never seeds, never labels
#   translation_support          -> used later as translation reference material
#   linguistic_support           -> optional analysis only; never safety labels
#
# `license`: the team confirmed on 2026-10-08 that all 15 files are open source
# and free to use publicly (OPEN_TEAM_CONFIRMED). The exact licence name and
# required citation of each source still go into the dataset card (Phase 7).

sources_version: "0.1"
raw_dir: data/raw

sources:
  nichehazardqa:
    display_name: NicheHazardQA
    archive: NicheHazardQA.zip
    member: NicheHazardQA.json
    sha256: a59c466f4305ab90bf33f8c3f0a2c67e8786c9f0b0d09cca2fc499c4df5b710d
    format: jsonl                      # file extension says .json, content is JSON Lines
    role: safety_seed
    seed_eligible: true
    id_prefix: NHQA
    reference_field: Index
    text_field: Question
    source_category_field: Domain
    metadata_fields: []
    ignored_fields: []
    filters: {}
    source_language: en
    default_intended_label: UNSAFE
    intended_label_basis: >-
      Provisional, source-derived: the source is a collection of hazard-oriented
      questions grouped into harm domains. Some items are arguably benign or
      ambiguous (e.g. ethics questions); human review decides the final label.
    license: OPEN_TEAM_CONFIRMED

  data_for_hub:
    display_name: data_for_hub
    archive: data_for_hub.zip
    member: data_for_hub.json
    sha256: c8ae6302e53f1acf6582ffccc747caac5b2fc8eeec7e91b178ba4570ddc3a8a5
    format: json_array
    role: safety_seed
    seed_eligible: true
    id_prefix: DFH
    reference_field: id
    text_field: question
    source_category_field: topic       # academic subject area, NOT a harm category
    metadata_fields: [subtopic]
    # Multi-turn conversations contain model-generated responses (some of them
    # harmful). They are deliberately NOT imported into seeds.
    ignored_fields: [blue_conversations, red_conversations]
    filters: {}
    source_language: en
    default_intended_label: UNSAFE
    intended_label_basis: >-
      Provisional, source-derived: questions are paired with red-team
      conversations in the source. Some items are arguably benign or ambiguous
      (e.g. questions about dehydration limits); human review decides the final label.
    license: OPEN_TEAM_CONFIRMED

  dataset_10k:
    display_name: dataset_10k
    archive: dataset_10k(1).zip
    member: dataset_10k(1).jsonl
    sha256: 246fe631ad7b2a8f989d3ef7c44af2e4642c95c744e01f9f9ab6b4880cb7e9ba
    format: jsonl
    role: benign_control
    seed_eligible: true
    id_prefix: D10K
    reference_field: unique_id
    text_field: question
    source_category_field: category
    metadata_fields: [question_id, domain, expected, language]
    ignored_fields: []
    # English rows only become seeds. The Hindi/Marathi/Gujarati/Odia rows are
    # parallel versions (same category + question_id) and are kept as candidate
    # reference translations for Phase 2 — their translation provenance
    # (human vs machine) is unknown.
    filters:
      language: [English]
      category: [factual_questions, indian_questions]
    source_language: en
    default_intended_label: SAFE
    intended_label_basis: >-
      Provisional, source-derived: factual QA questions from a multilingual QA
      set, used as benign controls. Human review decides the final label.
    license: OPEN_TEAM_CONFIRMED

