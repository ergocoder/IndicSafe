# Generation / seed / QC configuration — IndicSafe
# ---------------------------------------------------------------------------
# Phase 1 uses: generator_version, random_seed, seed_validation, pilot.
# Phase 2 uses: transformations, transformation_engine, translation,
# transliteration, paraphrase, and qc.script; Phase 3 adds qc.language; Phase 4
# adds code_mixing and qc.code_mix; Phase 5 adds qc.duplicate and qc.semantic.
# qc.quality_score and qc.human_review are still Phase 0 design; nothing reads
# them yet.
# Every threshold is an initial value to calibrate on the pilot.

generator_version: "0.1.0"
random_seed: 42

seed_validation:
  min_chars: 10
  max_chars: 1000
  min_script_confidence: 0.90      # share of letters in the declared script
  reject_replacement_char: true    # U+FFFD means the text was already damaged
  # Byte sequences typical of UTF-8 text decoded as cp1252/latin-1 (seen in MLI).
  mojibake_markers: ["Ã", "â€", "Ã°Å"]

pilot:
  dataset_version: "v0.1-pilot-seeds"
  target_size: 30
  # Per-source quotas (must sum to target_size). Within each source, seeds are
  # spread evenly across source categories.
  quotas:
    nichehazardqa: 12
    data_for_hub: 8
    dataset_10k: 10
  # Template-diversity guard: skip a candidate whose word-set Jaccard similarity
  # to an already selected seed is >= this value (NicheHazardQA is heavily
  # templated, e.g. "How can I use <X> to promote ...").
  max_word_jaccard: 0.5

# ---------------- Transformation engine (Phase 2) -------------------------
# Types are implemented in code (generator/transformation_engine.py registry);
# this list decides which may run. A type listed as enabled but not
# implemented is refused at run time with a clear error.
transformations:
  enabled:
    - identity               # seed -> root variant (en/Latn/L0), parent of every chain
    - translation            # en -> hi / mr / gu, native script
    - transliteration        # Deva / Gujr -> Latn (romanized); also other script conversion
    - code_mixing            # hi-en / mr-en / gu-en, levels L1, L2 (Phase 4)
    - paraphrase             # optional, en only for MVP
  disabled:
    - noisy_spelling
    - regional_variation

transformation_engine:
  engine_version: "0.1.0"
  id_hash_chars: 16                 # hex chars of sha256 kept in prompt / transformation ids
  # Hooks run on every child, in order, right after it is produced. Results
  # are recorded on the transformation record; FAIL keeps the child (for
  # audit) but blocks further transformations from it.
  validation_hooks:
    # code_mix_band: measured code_mix_ratio must fall in the target level's
    # band (qc.code_mix); not applicable (PASS) to variants without a level.
    default: [non_empty, text_integrity, expected_script, differs_from_parent, length_ratio, code_mix_band]
    identity: [non_empty, text_integrity, expected_script]
  # Output/parent character-length ratio outside [min, max] -> WARN (possible
  # truncation or hallucination). Design values, to calibrate on the pilot.
  length_ratio:
    min: 0.30
    max: 3.00

# Translation sits behind a provider interface (team decision, 2026-10-08).
# Default = local open-source MT; no LLM API is hard-coded. Swapping providers
# must not require changes to transformation, QC or database code.
translation:
  default_provider: indictrans2       # first candidate; confirmed only after the pilot evaluation
  providers:
    indictrans2:
      type: local_mt
      enabled: true
      target_languages: [hi, mr, gu]
      model: ai4bharat/indictrans2-en-indic-dist-200M   # gated: accept terms on HF + `hf auth login`
      options:
        # Pinned commit: reproducible output, and the trust_remote_code model files
        # cannot change underneath us. null = latest; the resolved sha is recorded
        # on every transformation record either way.
        revision: 173b94239f7c38886b2747b8d4a5db771a7e1232   # HF commit, 2026-10-08
        device: auto              # auto (cuda if available, else cpu) | cuda | cpu
        fp16: true                # half precision on CUDA only; cpu always runs fp32
        batch_size: 2             # sentences per generate() call; halved automatically on CUDA OOM (4 OOMed once on 4 GB)
        num_beams: 5              # IndicTrans2 reference decoding
        max_new_tokens: 256
        use_cache: false          # KV cache breaks the model's remote code on transformers 4.57; speed only
        cache_dir: null           # HF cache; null = HF_HUB_CACHE / HF_HOME env or the HF default
    llm:
      type: llm_api                   # optional adapter; reads its settings from .env
      enabled: false
  selection: >-
    Phase 2 runs a small pilot, evaluates translation quality (native-speaker
    review of a sample per language), and only then fixes the production model.

# Romanisation (native script -> Latn). Chosen in Phase 2b/3 after comparing
# strict schemes (ISO 15919 / ITRANS) with colloquial romanisation on pilot
# outputs; IndicXlit could not be installed (fairseq, no Windows/py3.13 build).
# See docs/phase2b_3_notes.md.
transliteration:
  default_provider: colloquial_roman
  providers:
    colloquial_roman:
      type: rule_based
      enabled: true
      target_languages: [hi, mr, gu]
      model: aksharamukha/RomanColloquial
      options:
        schwa_deletion: true      # Aksharamukha RemoveSchwaHindi (Gujarati goes through Devanagari)
        final_nasal_as_n: true    # word-final anusvara/candrabindu -> "n" (main, hain, hoon)

# Code-mixing (Phase 4): native-script L0 translation -> L1 / L2 with English.
# No LLM. mt_lexical_swap aligns English content words of the source to words
# of the translation, then swaps a controlled number of them back to English
# so the measured code_mix_ratio lands in the level band (languages.yaml).
# Romanised code-mixed variants are the transliteration of the native ones.
code_mixing:
  default_provider: mt_lexical_swap
  levels: [L1, L2]                    # generated per language (must be in the language's code_mix_levels)
  providers:
    mt_lexical_swap:
      type: rule_based
      enabled: true
      target_languages: [hi, mr, gu]
      model: null                     # alignment uses translation.default_provider (IndicTrans2)
      options:
        target_point: 0.5             # aim at this fraction of the band (0.5 = midpoint)
        min_word_chars: 3             # shorter English words are not swapped
        phonetic_min_similarity: 0.70 # romanised target word vs English word: loanword match
        min_stem_chars: 2             # shortest native stem accepted for a prefix match
        # English words never swapped (function words, auxiliaries, pronouns).
        stopwords_en: [a, an, the, and, or, but, if, of, to, in, on, at, by, for, from, with, without,
                       into, onto, about, as, than, then, that, this, these, those, there, here,
                       is, are, was, were, be, been, being, am, do, does, did, done, doing, have, has,
                       had, can, could, will, would, shall, should, may, might, must, not, no, yes,
                       i, me, my, mine, we, us, our, you, your, he, him, his, she, her, it, its, they,
                       them, their, what, which, who, whom, whose, when, where, why, how, some, any,
                       all, each, every, other, such, own, same, so, too, very, just, also, only,
                       one, ones, more, most, much, many, few, out, up, down, over, under, again,
                       between, through, during, before, after, while, because, ways, way]
        # Case markers / postpositions written attached to the noun. When a
        # swapped word ends in one, it is kept as a separate token after the
        # English word ("bank च्या"), as in written code-mixing. Single-letter
        # markers (Marathi त) are left out: too many words just end in them.
        clitics:
          hi: []
          mr: [च्या, ची, चा, चे, ला, ना, ने, मध्ये, साठी, कडून, कडे, तून, वर, शी, पासून, बद्दल]
          gu: [ના, ની, નું, નો, નાં, માં, થી, ને, એ, માટે, પર, વિશે]

paraphrase:
  default_provider: null              # optional; LLM adapter off by default
  languages: [en]                     # MVP: English paraphrase only
  providers:
    llm:
      type: llm_api
      enabled: false

qc:
  language:
    # Language ID for native-script variants (Phase 3, generator/language_qc.py).
    # Lingua decides among `candidates`; hi vs mr is decided by function-word
    # markers when at least `min_marker_tokens` markers are present.
    detector: lingua_markers
    candidates: [en, hi, mr, gu]
    min_marker_tokens: 2
    pass_confidence: 0.80
    review_confidence: 0.50
  script:
    native_min_share: 0.85        # native-script letters / all letters, native condition
    romanized_min_share: 0.95     # Latn letters / all letters, romanized condition
  code_mix:
    # Measured ratio outside the band by <= tolerance -> WARN / REVIEW; further -> FAIL.
    tolerance: 0.03               # allowed distance outside the level band before FAIL
  duplicate:
    near_dup_char3_jaccard: 0.85  # lexical near-duplicate (other seeds, same language + script)
    near_dup_embedding_cosine: 0.95   # design value; not used yet (embedding near-dup)
  semantic:
    # Cosine(English seed, variant) with a multilingual sentence encoder.
    # Romanised variants inherit the score of their native-script parent
    # (romanisation is a deterministic script change; the encoder is unreliable
    # on romanised hi / mr / gu).
    model: setu4993/LaBSE         # ungated, Apache-2.0, 471M params; LaBSE pooler output
    revision: 5afa72968dfe068421082cbc30411073b15a6693   # HF commit, 2026-10-08
    device: auto                  # auto | cuda | cpu; fp16 on CUDA
    batch_size: 16
    cache_dir: null               # null = HF_HUB_CACHE (D:\hf_cache on this machine)
    pass: 0.80
    review: 0.65                  # below -> FAIL (semantic_drift)
  quality_score:
    weights:
      semantic: 0.30
      language: 0.20
      script: 0.15
      code_mix_fit: 0.15
      format: 0.10
      novelty: 0.10
    accept_min: 0.75
    review_min: 0.55
  human_review:
    pilot_review_fraction: 1.0    # every pilot item is reviewed
    pass_sample_fraction: 0.20    # later: share of auto-PASS items sampled for review
